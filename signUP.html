<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/signUP.css?v=1.0">
    <title>Create Account</title>
</head>
<body>
    <div class="up">
        <img src="./img/logo.png" alt="Logo" class="logo">
        <h1>Wander Wheels</h1>
    </div>
    <div class="bg"></div>
    <img src="/img/orangeCar.png" alt="Car Desgin" class="orange-car">
    <div class="form">
        <div class="title">
            <p>Create An Account</p>
        </div>
        <form action="/home" method="GET">
            <div class="name-fields">
                <input type="text" name="fname" placeholder="First Name" required>
                <input type="text" name="lname" placeholder="Last Name" required>
            </div>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="pass" placeholder="Password" required>
            <input type="password" name="confirm" placeholder="Confirm Password" required>
            <input type="submit" value="Sign Up" name="signUp_button">
        </form>
        <p class="account-link">Already have account? <a href='/login'>Sign in</a></p>
    </div>
    <footer>Copyright © 2024 - Wander Wheels. All Rights Reserved.</footer>
</body>
</html>
