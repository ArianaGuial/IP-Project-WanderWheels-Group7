<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/login.css?v=1.0">
    <title>Login</title>
</head>
<body>
    <div class="up">
        <img src="./img/logo.png" alt="Logo" class="logo">
        <h1>Wander Wheels</h1>
    </div>
    <div class="bg"></div>
    <img src="/img/orangeCar.png" alt="Car Desgin" class="orange-car">
    <div class="form">
        <div class="title">
            <p>Login Now</p>
        </div>
        <form action="/login" method="POST">
            <input type="text" name="email" placeholder="Email">
            <input type="password" name="password" placeholder="Password">
            <input type="submit" value="Login" name="login_button">
        </form>
        <p class="account-link">Not a member? <a href='/signup'>Sign Up Now!</a></p>
    </div>
    <footer>Copyright © 2024 - Wander Wheels. All Rights Reserved.</footer>
</body>
</html>
